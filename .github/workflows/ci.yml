name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # AgentDeck audits its own repository on every push.
      # A high-severity finding exits 2 and fails the build.
      - name: self-scan
        run: node dist/index.js scan .
